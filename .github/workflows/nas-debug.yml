name: Panel NAS - build debug

on:
  pull_request:
    paths:
      - 'nas-browser/**'
      - 'settings.gtv.gradle.kts'
      - 'gradle/**'
      - 'build.gradle.kts'
      - '.github/workflows/nas-debug.yml'
  push:
    branches:
      - main
      - feature/nas-dashboard-v2
    paths:
      - 'nas-browser/**'
      - 'settings.gtv.gradle.kts'
      - 'gradle/**'
      - 'build.gradle.kts'
      - '.github/workflows/nas-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner already has the Android SDK. setup-android@v3 tries to
      # install the obsolete "tools" package and fails before compiling.
      - name: Install Android SDK 36 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Panel NAS
        run: gradle -c settings.gtv.gradle.kts :nas-browser:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: panel-nas-debug
          path: nas-browser/build/outputs/apk/debug/nas-browser-debug.apk
          if-no-files-found: error
